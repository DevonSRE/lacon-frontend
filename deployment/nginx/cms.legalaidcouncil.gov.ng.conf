# nginx site for the LACON frontend (production).
#
# Install on the server:
#   sudo cp cms.legalaidcouncil.gov.ng.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/cms.legalaidcouncil.gov.ng.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The container listens on 127.0.0.1:${HOST_WEB_PORT} (docker-compose.prod.yml).
# Keep the port in the upstream below equal to HOST_WEB_PORT in the server's .env.
#
# First certificate (once; the 443 block below fails `nginx -t` until it exists):
#   1. enable only the port-80 server block, reload nginx
#   2. sudo mkdir -p /var/www/certbot
#      sudo certbot certonly --webroot -w /var/www/certbot -d cms.legalaidcouncil.gov.ng
#   3. enable the whole file, `sudo nginx -t && sudo systemctl reload nginx`
# certbot's timer renews it; add `--deploy-hook "systemctl reload nginx"` so renewals load.

upstream lacon_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# http: answer the Let's Encrypt challenge, send everything else to https.
server {
    listen 80;
    listen [::]:80;
    server_name cms.legalaidcouncil.gov.ng;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cms.legalaidcouncil.gov.ng;

    ssl_certificate     /etc/letsencrypt/live/cms.legalaidcouncil.gov.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.legalaidcouncil.gov.ng/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Server Actions accept one 10 MB document (bodySizeLimit 11mb in next.config.ts).
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Hashed build assets never change: let browsers cache them for a year.
    location /_next/static/ {
        proxy_pass http://lacon_frontend;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        proxy_pass http://lacon_frontend;
    }
}
